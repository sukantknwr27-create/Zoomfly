name: Deploy Supabase Edge Functions

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ndaurluolurdljrjbxii
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy all edge functions
        run: |
          set -e
          for fn in \
            create-razorpay-order \
            flight-create-booking \
            flight-search \
            flight-select-fare \
            flight-ticket-processor \
            generate-sitemap \
            get-guest-booking \
            get-payment-link \
            get-service-price \
            rail-create-booking \
            rail-search \
            razorpay-webhook \
            send-booking-email \
            test-api-provider \
            verify-razorpay-payment \
          ; do
            echo "── Deploying $fn ──────────────────────────"
            supabase functions deploy "$fn" \
              --project-ref "$SUPABASE_PROJECT_ID" \
              --no-verify-jwt
          done
