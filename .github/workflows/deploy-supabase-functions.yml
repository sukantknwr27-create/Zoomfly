name: Deploy Supabase Edge Functions

# Runs automatically whenever anything under supabase/functions/ changes
# on main, and can also be triggered manually from the Actions tab
# (Actions → Deploy Supabase Edge Functions → Run workflow) — use the
# manual trigger the first time, since committing this workflow file
# itself won't match the path filter below.
#
# All functions deploy with --no-verify-jwt: every function here needs
# it for CORS preflight requests to succeed, and razorpay-webhook needs
# it permanently since Razorpay never sends a Supabase JWT.
#
# Requires one repo secret: SUPABASE_ACCESS_TOKEN
# (GitHub repo → Settings → Secrets and variables → Actions → New
# repository secret). Get the token from the Supabase dashboard →
# account icon (top right) → Access Tokens → Generate new token.

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ndaurluolurdljrjbxii
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy all edge functions
        run: |
          set -e
          for fn in \
            create-razorpay-order \
            flight-create-booking \
            flight-search \
            flight-select-fare \
            flight-ticket-processor \
            generate-sitemap \
            get-guest-booking \
            get-payment-link \
            get-service-price \
            rail-create-booking \
            rail-search \
            razorpay-webhook \
            send-booking-email \
            test-api-provider \
            verify-razorpay-payment \
          ; do
            echo "── Deploying $fn ──────────────────────────"
            supabase functions deploy "$fn" \
              --project-ref "$SUPABASE_PROJECT_ID" \
              --no-verify-jwt
          done
