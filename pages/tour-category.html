<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Tour Categories — ZoomFly</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;1,600&family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
  <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg"/>
  <link rel="stylesheet" href="/assets/css/main.css"/>
  <link rel="stylesheet" href="/assets/css/premium.css"/>
  <link rel="stylesheet" href="/assets/css/pages.css"/>
  <style>
    body{font-family:'Inter',system-ui;background:#F3F2EE;color:#1C2340}
    .cat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:18px;max-width:1200px;margin:0 auto;padding:64px 28px}
    .cat-card{background:#fff;border:1px solid #E4E8EF;border-radius:16px;padding:28px 20px;text-align:center;cursor:pointer;transition:all .28s}
    .cat-card:hover{box-shadow:0 12px 40px rgba(12,27,51,.12);transform:translateY(-5px);border-color:rgba(201,146,42,.3)}
    .cat-icon{font-size:2.6rem;margin-bottom:14px}
    .cat-name{font-family:'Space Grotesk',system-ui;font-size:.95rem;font-weight:700;margin-bottom:6px;color:#1C2340}
    .cat-count{font-size:.75rem;color:#8896AB;margin-bottom:14px}
    .cat-link{display:inline-flex;align-items:center;gap:5px;font-family:'Space Grotesk',system-ui;font-size:.78rem;font-weight:700;color:#C9922A}
  </style>
  <script type="module" src="/assets/js/theme.js"></script>
</head>
<body data-page="tours">
<header class="nav" id="mainNav"></header>
<section style="background:linear-gradient(145deg,#0C1B33 0%,#1a2d4a 45%,#1e3a6e 100%);padding:110px 2rem 60px;text-align:center;position:relative;overflow:hidden;">
  <div style="position:absolute;inset:0;background-image:radial-gradient(circle at 1px 1px,rgba(255,255,255,.04) 1px,transparent 0);background-size:38px 38px;pointer-events:none;"></div>
  <div style="position:absolute;inset:0;background:radial-gradient(ellipse at 60% 40%,rgba(201,146,42,.10),transparent 60%);pointer-events:none;"></div>
  <div style="position:relative;z-index:2;">
    <div style="display:inline-flex;align-items:center;gap:7px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);border-radius:100px;padding:6px 18px;font-family:'Space Grotesk',system-ui;font-size:.72rem;font-weight:500;color:rgba(255,255,255,.82);margin-bottom:18px;">Explore by Category</div>
    <h1 style="font-family:'Cormorant Garamond',serif;font-size:clamp(2.2rem,5vw,3.5rem);font-weight:600;color:#fff;line-height:1.1;letter-spacing:-.02em;margin-bottom:12px;">Find the Perfect<br><em style="font-style:italic;color:#E8B84B">Tour for You</em></h1>
    <p style="color:rgba(255,255,255,.65);font-size:1rem;max-width:500px;margin:0 auto;">Browse by travel style, interest or destination type.</p>
  </div>
</section>
<div class="cat-grid" id="cat-grid">
  <div style="grid-column:1/-1;text-align:center;color:#8896AB;padding:40px 0">Loading categories…</div>
</div>
<section class="newsletter" id="newsletter"></section>
<footer class="footer" id="mainFooter"></footer>
<script type="module" src="/assets/js/main.js"></script>
<script type="module">
  // This page used to hardcode a fixed list of ~10 guessed category slugs
  // (beach, adventure, honeymoon...). That worked when the catalog had 10
  // packages. At 800+ packages there are almost certainly categories in
  // the real data this list never anticipated — those packages had no
  // card to appear under at all, no matter how many of them existed.
  // Fix: don't guess categories. Read whatever `category` values actually
  // exist on active packages, count them for real, and render one card
  // per real category. A category with 0 active packages simply won't
  // appear — there is no fixed list left to drift out of sync.
  import { supabase } from '/assets/js/supabase.js';

  const grid = document.getElementById('cat-grid');

  // Known categories get a curated icon + display label. Anything else
  // (which, at 800+ packages, is likely most of them) still gets a card —
  // just with a generic icon and a title-cased version of the slug —
  // rather than being silently dropped.
  const META = {
    beach:      { icon: '🏖️', label: 'Beach Holidays' },
    adventure:  { icon: '🧗', label: 'Adventure' },
    nature:     { icon: '🌴', label: 'Nature & Wildlife' },
    wildlife:   { icon: '🦁', label: 'Wildlife & Safari' },
    heritage:   { icon: '🏛️', label: 'Heritage & Culture' },
    honeymoon:  { icon: '💑', label: 'Honeymoon' },
    family:     { icon: '👨\u200d👩\u200d👧\u200d👦', label: 'Family Tours' },
    spiritual:  { icon: '🛕', label: 'Spiritual & Pilgrimage' },
    cruise:     { icon: '🚢', label: 'Cruise' },
    group:      { icon: '👥', label: 'Group Tours' },
  };
  const DEFAULT_ICON = '🗺️';
  const titleCase = (s) => s.replace(/[-_]+/g, ' ').replace(/\b\w/g, c => c.toUpperCase());

  const cardHtml = (key, count, { icon, label }, href) => `
    <div class="cat-card" onclick="location.href='${href}'">
      <div class="cat-icon"><span class="emoji-icon" style="font-size:21px;line-height:1;display:inline-block;vertical-align:middle">${icon}</span></div>
      <div class="cat-name">${label}</div>
      <div class="cat-count">${count} Package${count === 1 ? '' : 's'}</div>
      <div class="cat-link">Explore →</div>
    </div>`;

  try {
    // Must match getPackages()'s is_active filter in supabase.js exactly —
    // otherwise this page counts draft/inactive packages that customers
    // can never actually see on packages.html, which is precisely the
    // fake-inventory problem the site's Active=no discipline exists to prevent.
    // .limit(5000) is a safety net well above current volume — PostgREST's
    // default cap is 1000 rows, which 800+ packages would already brush against.
    const { data: packages, error } = await supabase
      .from('packages').select('category,type').eq('is_active', true).limit(5000);
    if (error) throw error;
    const all = packages || [];

    // Normalize so "Beach", "BEACH ", and "beach" all count as the same
    // category instead of splitting into separate, half-populated cards —
    // a real risk across 800+ packages entered over time.
    const counts = new Map();
    for (const p of all) {
      const cat = (p.category || '').trim().toLowerCase();
      if (!cat) continue;
      counts.set(cat, (counts.get(cat) || 0) + 1);
    }
    const intlCount = all.filter(p => p.type === 'international').length;

    const cards = [];
    if (intlCount > 0) {
      cards.push({ key: 'international', count: intlCount, meta: { icon: '🌍', label: 'International' },
        href: '/pages/packages.html?filter=international' });
    }
    [...counts.entries()]
      .sort((a, b) => b[1] - a[1]) // most-stocked categories first
      .forEach(([cat, count]) => {
        cards.push({
          key: cat, count,
          meta: META[cat] || { icon: DEFAULT_ICON, label: titleCase(cat) },
          href: `/pages/packages.html?filter=${encodeURIComponent(cat)}`
        });
      });

    grid.innerHTML = cards.length
      ? cards.map(c => cardHtml(c.key, c.count, c.meta, c.href)).join('')
      : '<div style="grid-column:1/-1;text-align:center;color:#8896AB;padding:40px 0">No active packages yet — check back soon.</div>';
  } catch (e) {
    console.warn('[tour-category] could not load categories:', e.message);
    grid.innerHTML = `<div style="grid-column:1/-1;text-align:center;color:#8896AB;padding:40px 0">
      Couldn't load categories right now. <a href="/pages/packages.html" style="color:#C9922A;font-weight:700">Browse all packages →</a></div>`;
  }
</script>
</body>
</html>
